name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is not published for ubuntu-26.04, so it runs on 22.04.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test suite (no network, no install needed)
        run: python -m unittest discover -s tests -v
      - name: Demo runs end to end
        run: |
          python -m otto demo --reset
          python -m otto run --once
          python -m otto status --limit 5
      - name: Doctor exits clean
        run: python -m otto doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check otto tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t otto:ci .
      - name: Run the demo inside the container
        run: docker run --rm otto:ci demo --reset
