name: screenshot

# Refreshes docs/dashboard.png from a real render of the local dashboard.
# Run it from the Actions tab after changing the UI; it commits the image
# itself. Nothing here runs on a normal push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser (only this job needs it)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render the demo dashboard
        run: python scripts/screenshot.py
      - name: Render the landing page
        run: python scripts/screenshot_site.py
      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.png docs/site.png
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "docs: refresh dashboard screenshot"
          git push
